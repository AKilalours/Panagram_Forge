    revision: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
    released: 2025-01
    role: held_out
    output_redistributable: true

  - family: api
    provider: api
    model_id: claude-sonnet-5
    revision: dateless_id_is_pinned_snapshot
    released: 2026-01
    role: held_out
    output_redistributable: false
    budget:
      max_documents: 2000
      hard_stop_on_budget: true
