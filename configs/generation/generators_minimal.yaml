# Minimal-scale generator roster. Four held-in families at 1.7B to 3.8B.
#
# WHY SMALLER MODELS: throughput roughly triples, which is what takes Phase 2 from
# 22 GPU-hours to 1.5. These are still real, distinct generator families, which is what
# the research question needs.
#
# RECORDED LIMITATION: smaller models produce more detectable text, so absolute FPR and
# FNR will look better than a 7B-to-70B setup. The comparison BETWEEN arms is unaffected.
# Absolute numbers must never be quoted as if they came from frontier-scale generators.
#
# ALL HELD-IN MODELS ARE NON-GATED on HuggingFace, so no license acceptance is needed.
# The held-out gemma and llama entries ARE gated: accept their licenses at
# huggingface.co/<model> and set HF_TOKEN, or swap in the non-gated alternatives noted.
spec_version: data_spec_v1

decoding_grid:
  temperature: [0.5, 0.7, 1.0]
  top_p: [0.9, 0.95]
  include_greedy: true
  # A CEILING, not a target. Every document now gets its own budget from its own length
  # target (forge.generation.assignment.token_budget); this only stops a pathologically
  # long source from asking for more than the context can hold.
  #
  # Was 640 for every document, which is where the length confound came from: 640 tokens is
  # about 474 words against a human median of 250, and the models treated the cap as a
  # target. 640 also still binds at 365 source words, and the human corpus's p90 is 367, so
  # leaving it there would clip the entire upper tail and trade a too-long bias for a
  # too-short one. 2048 covers the corpus's longest documents (1100 words is about 1930
  # tokens with headroom) and still leaves room for the prompt inside max_model_len 4096.
  max_new_tokens: 2048

families:
  - family: qwen
    provider: open_source
    model_id: Qwen/Qwen2.5-3B-Instruct
    revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
    released: 2024-09
    role: held_in
    output_redistributable: true

  - family: phi
    provider: open_source
    model_id: microsoft/Phi-3.5-mini-instruct
    revision: 2fe192450127e6a83f7441aef6e3ca586c338b77
    released: 2024-08
    role: held_in
    output_redistributable: true

  - family: smollm
    provider: open_source
    model_id: HuggingFaceTB/SmolLM2-1.7B-Instruct
    revision: 31b70e2e869a7173562077fd711b654946d38674
    released: 2024-11
    role: held_in
    output_redistributable: true

  - family: falcon
    provider: open_source
    model_id: tiiuae/Falcon3-3B-Instruct
    revision: 411bb94318f94f7a5735b77109f456b1e74b42a1
    released: 2024-12
    role: held_in
    output_redistributable: true

  # Held out. Never generate training data with these.
  - family: gemma
    provider: open_source
    model_id: google/gemma-2-2b-it        # GATED. Non-gated fallback: Qwen/Qwen2.5-1.5B-Instruct
    revision: 299a8560bedf22ed1c72a8a11e7dce4a7f9f51f8
    released: 2024-06
    role: held_out
    output_redistributable: false

  - family: deepseek
    provider: open_source
