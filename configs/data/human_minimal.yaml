# FORGE-HUMAN v0.1-min. The under-$20 configuration, see docs/compute_plan.md section 6.
# Same contract as human.yaml, reduced targets and a short-document filter.
spec_version: data_spec_v1
dataset_version: v0.1-min

sources:
  - id: fw
    hf_repo: HuggingFaceFW/fineweb
    config: sample-10BT
    license: ODC-By-1.0
    redistributable: false
    class: train_and_reserve
    train_share: 0.60
    filters: { language_score_min: 0.85 }

  - id: fwe
    hf_repo: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    license: ODC-By-1.0
    redistributable: false
    class: train_and_reserve
    train_share: 0.40
    filters: { language_score_min: 0.85, int_score_min: 4 }

targets:
  human_train: 60000
  human_reserve: 500000
  human_eval: 10000

cleaning:
  # Short-document filter. At ~400 tokens a document is exactly one 512-token window.
  # RECORDED LIMITATION: this makes FORGE v1 a single-window detector and leaves the
  # windowing and aggregation path under-tested. See docs/compute_plan.md section 6.
  min_chars: 800
  min_tokens: 150
  max_tokens: 400
  language: en
  language_score_min: 0.85
  minhash_permutations: 128
  minhash_jaccard_threshold: 0.8
  processing_version: clean_v1

splits:
  salt: forge-v1
  ratios: { train: 0.80, val: 0.10, test: 0.10 }
  group_key: source_group_id
