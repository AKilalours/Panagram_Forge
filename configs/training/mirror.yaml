# Stage 1. Same budget as baseline, mirrors instead of random AI. Budget is held equal
# on purpose: otherwise an improvement is just "more data" and proves nothing.
spec_version: data_spec_v1
experiment: { id: forge_exp_010, stage: mirror }
model_config: configs/models/forge_base.yaml
data: { dataset_version: v0.1, include: [human, ai_mirror] }
training:
  batch_size: 32
  grad_accum: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  epochs: 3
  seed: 42
  precision: bf16
  gradient_checkpointing: true
distributed: { strategy: fsdp, sharding: full_shard }
tracking: { backend: wandb, project: forge }
