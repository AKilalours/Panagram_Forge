# Minimal-scale baseline arm. Budget held EQUAL across arms: any improvement must come
# from WHICH data, not HOW MUCH. See docs/evaluation.md.
spec_version: data_spec_v1
experiment: { id: forge_min_baseline, stage: baseline }
model_config: configs/models/forge_base.yaml
fpr_budget: 0.001

paths:
  human: data/silver
  ai: data/silver/random          # THIS ARM'S AI SOURCE. Each arm must differ.
  mixed: data/silver/mixed
  out: outputs

data:
  dataset_version: v0.1-min
  # EQUAL BUDGET. Each arm's validator rejects at its own rate, so generation yields
  # different accepted counts. Set this to the SMALLER arm's count, identically in every
  # arm's config, before training. Left null the comparison measures data volume as much
  # as data strategy. Fill it in from the generation stats, do not guess.
  # Filled from generation, not guessed: mirrors accepted 18,856 documents and random
  # accepted 22,713, counted from the parquet with pyarrow rather than from the log,
  # because a log records what the generator believed and the parquet records what landed.
  # The smaller arm sets the budget for both.
  ai_cap: 18856
  # LENGTH MATCHING. Point both arms at the MIRROR arm's directory. The mirror arm then
  # matches itself, a no-op; the control arm is reshaped so its length distribution tracks
  # the mirror arm's. Without this the arms differ in length as well as in matching,
  # because 85% of mirror rejections were length overshoot and the survivors skew long.
  ai_reference: data/silver/mirrors
  arm: random              # verified against prompt_version at load

training:
  batch_size: 32
  grad_accum: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  epochs: 3
  seed: 42
  precision: bf16
  gradient_checkpointing: true
  token_loss_weight: 0.5
  num_workers: 4
  log_every: 50

distributed: { strategy: none }
tracking: { backend: wandb, project: forge }
