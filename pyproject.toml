[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "FORGE: Failure-Driven Synthetic Data Generation for Robust AI-Content Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Akila Lourdes Miriyala Francis" }]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "polars>=0.20",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Phase 1: ingestion and cleaning
data = [
  "datasets>=2.18",
  "huggingface-hub>=0.22",
  "fasttext-langdetect>=1.0",
  "ftfy>=6.2",
  "selectolax>=0.3",
  "datasketch>=1.6",
  "presidio-analyzer>=2.2",
]
# FORGE-IMAGE: see docs/image_spec_v1.md
image = [
  "pillow>=10.0",
]
# Phase 2 and 3: generation and training
train = [
  "torch>=2.3",
  "transformers>=4.40",
  "accelerate>=0.29",
  "sentencepiece>=0.2",
  "scikit-learn>=1.4",
  "wandb>=0.16",
]
# Phase 4: hard negative mining and failure atlas
mining = [
  "sentence-transformers>=2.7",
  "hdbscan>=0.8.33",
  "umap-learn>=0.5",
]
# Phase 7: distributed training
dist = [
  "ray[default,train]>=2.10",
  "deepspeed>=0.14",
]
# Phase 8: serving, monitoring, orchestration
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # /v1/image/analyze takes an UploadFile. FastAPI raises at import time, not at request
  # time, when this is absent, so omitting it does not degrade the app: it stops it booting.
  "python-multipart>=0.0.9",
  # The image path decodes every upload with Pillow. It is also in the `image` extra; the
  # server cannot run without it, so it is a hard serve dependency too.
  "pillow>=10.0",
  "onnxruntime>=1.17",
  "prometheus-client>=0.20",
  "boto3>=1.34",
]
orchestration = [
  "apache-airflow>=2.9",
  "pyspark>=3.5",
]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
