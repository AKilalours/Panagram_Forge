# Local development infrastructure for FORGE.
# S3-compatible object store, metrics, dashboards. Nothing here is production.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forge
      MINIO_ROOT_PASSWORD: forgeforge
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ../../configs/serving/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: forge
    depends_on: [prometheus]

volumes:
  minio-data:
